name: Daily Auto Streak Bot

on:
  schedule:
    # Berjalan otomatis setiap hari pukul 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  # Memungkinkan pemicu manual dari tab Actions di GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Streak Activity
        run: |
          mkdir -p .github/activity
          date -u +"Last commit: %Y-%m-%d %H:%M:%S UTC" > .github/activity/streak.txt

      - name: Commit and Push
        run: |
          git config --global user.name "mkhcenter"
          git config --global user.email "yasinaahmad4@gmail.com"
          git add .github/activity/streak.txt
          git commit -m "chore(streak): daily auto commit" || echo "Nothing to commit"
          git push
